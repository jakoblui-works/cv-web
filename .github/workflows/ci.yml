name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run test
  api-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install
      - name: Regenerate the api client from the prod spec
        run: pnpm generate:api
      - name: Fail if it differs from the committed client
        run: |
          if [ -n "$(git status --porcelain -- src/api/generated)" ]; then
            echo "::error::src/api/generated is out of date with the prod api spec. Run 'pnpm generate:api' and commit the result."
            git status --short -- src/api/generated
            git diff -- src/api/generated
            exit 1
          fi
