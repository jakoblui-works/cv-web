<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jakob Lui - CV Assembler</title>
    <!-- Shared by all sites (from web-template). The SVG for modern browsers; the ICO for the rest
         (`sizes="32x32"`, not "any", or Chrome picks the ICO over the SVG). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Static on purpose: link previews and crawlers don't run JavaScript, so every URL shares
         these. -->
    <meta name="description" content="Pick a role, concepts and skills, and get Jakob Lui&#39;s CV tailored to them as a PDF." />
    <link rel="canonical" href="https://cv.jakoblui.com/" />
    <!-- The header's background (`--surface`), in hex. Follows the system theme, not the toggle. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cv.jakoblui.com/" />
    <meta property="og:title" content="Jakob Lui - CV Assembler" />
    <meta property="og:description" content="Pick a role, concepts and skills, and get Jakob Lui&#39;s CV tailored to them as a PDF." />

    <!-- The app's og:image lines (1200 × 630, with og:image:width, og:image:height and
         og:image:alt) go below, a line away from the template's, so template updates don't
         conflict with them. cv-web and site-web render theirs from a Storybook story. -->

    <meta property="og:image" content="https://cv.jakoblui.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tailored CV: pick a role and skills, get a PDF. A CV page with the tailored lines highlighted." />

    <!-- Without it, Discord and X show a small thumbnail instead of the large card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Runs before the first paint so the page never flashes the wrong theme. The key is
      // shared-ui's THEME_STORAGE_KEY, which `ThemeToggle` writes.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <script>
      // A link with a selection opens the result layout, not the prerendered form (styles.css).
      (function () {
        var params = new URLSearchParams(location.search);
        if (params.has("title") && params.has("skills"))
          document.documentElement.setAttribute("data-cv-link", "");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
